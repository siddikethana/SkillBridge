
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillBridge | Student Skill Matcher</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f3f6ff;
  color: #20294a;
}

header {
  background: linear-gradient(120deg, #3826a8, #6c63ff);
  color: white;
  padding: 25px 8%;
}

header h1 {
  font-size: 30px;
}

header p {
  margin-top: 8px;
}

main {
  max-width: 900px;
  margin: 35px auto;
  padding: 0 18px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  margin-bottom: 22px;
  box-shadow: 0 5px 20px #25356a12;
}

h2 {
  margin-bottom: 18px;
  color: #3826a8;
}

label {
  display: block;
  margin: 15px 0 7px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccd2e8;
  border-radius: 8px;
  font-size: 16px;
}

button {
  background: #5546d8;
  color: white;
  padding: 13px 22px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  margin-top: 20px;
}

button:hover {
  background: #3826a8;
}

.results {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  margin-top: 18px;
}

.result-card {
  background: #f3f2ff;
  padding: 18px;
  border-radius: 12px;
  border-left: 4px solid #6c63ff;
}

.result-card h3 {
  margin-bottom: 10px;
}

.result-card p {
  line-height: 1.6;
}

.tag {
  display: inline-block;
  background: #e2e0ff;
  color: #3826a8;
  padding: 5px 9px;
  border-radius: 20px;
  margin-top: 10px;
  font-size: 13px;
}

.hidden {
  display: none;
}

footer {
  text-align: center;
  padding: 25px;
  color: #666;
}

@media (max-width: 600px) {
  header h1 {
    font-size: 24px;
  }

  .card {
    padding: 18px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎓 SkillBridge</h1>
  <p>Discover your skills. Build your future.</p>
</header>

<main>

  <section class="card">
    <h2>Find Your Career Path</h2>
    <p>
      Enter your skills and interests to discover
      projects, learning paths, and internship ideas.
    </p>

    <form id="skillForm">
      <label for="studentName">Student Name</label>
      <input
        type="text"
        id="studentName"
        placeholder="Enter your name"
        required
      >

      <label for="skills">Your Skills</label>
      <input
        type="text"
        id="skills"
        placeholder="Example: Python, Java, HTML"
        required
      >

      <label for="interest">Your Interest</label>
      <select id="interest" required>
        <option value="">Select your interest</option>
        <option value="web">Web Development</option>
        <option value="ai">Artificial Intelligence</option>
        <option value="data">Data Science</option>
        <option value="app">App Development</option>
        <option value="design">UI/UX Design</option>
      </select>

      <button type="submit">Find My Matches</button>
    </form>
  </section>

  <section id="output" class="card hidden">
    <h2 id="welcome"></h2>
    <p id="skillSummary"></p>
    <div id="results" class="results"></div>
  </section>

</main>

<footer>
  <p>SkillBridge © 2026 | Student Skill Matcher</p>
  <p>Learn • Build • Grow</p>
</footer>

<script>
const opportunities = {
  web: {
    title: "Web Development",
    project: "Personal Portfolio Website",
    learning: "Learn HTML, CSS, JavaScript and GitHub.",
    internship: "Frontend Developer Intern",
    skills: ["html", "css", "javascript", "react"]
  },

  ai: {
    title: "Artificial Intelligence",
    project: "AI Student Assistant",
    learning: "Learn Python, machine learning and AI basics.",
    internship: "AI / Machine Learning Intern",
    skills: ["python", "machine learning", "ai"]
  },

  data: {
    title: "Data Science",
    project: "Student Performance Analyzer",
    learning: "Learn Python, pandas, statistics and charts.",
    internship: "Data Analyst Intern",
    skills: ["python", "sql", "excel", "data analysis"]
  },

  app: {
    title: "App Development",
    project: "Student Task Manager App",
    learning: "Learn Java, Android development and databases.",
    internship: "Android Developer Intern",
    skills: ["java", "android", "kotlin"]
  },

  design: {
    title: "UI/UX Design",
    project: "College App Interface",
    learning: "Learn design principles, wireframes and Figma.",
    internship: "UI/UX Design Intern",
    skills: ["figma", "ui", "ux", "design"]
  }
};

const form = document.getElementById("skillForm");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const name = document.getElementById("studentName")
    .value.trim();

  const skills = document.getElementById("skills")
    .value.toLowerCase()
    .split(",")
    .map(skill => skill.trim())
    .filter(Boolean);

  const interest = document.getElementById("interest").value;
  const match = opportunities[interest];

  const matchedSkills = match.skills.filter(skill =>
    skills.some(userSkill => userSkill.includes(skill))
  );

  document.getElementById("welcome").textContent =
    "Hello, " + name + "!";

  document.getElementById("skillSummary").textContent =
    "Your interest: " + match.title +
    " | Matching skills: " +
    (matchedSkills.length ? matchedSkills.join(", ") : "Keep learning!");

  const cards = [
    {
      title: "🚀 Suggested Project",
      text: match.project
    },
    {
      title: "📚 Learning Path",
      text: match.learning
    },
    {
      title: "💼 Internship Idea",
      text: match.internship
    }
  ];

  document.getElementById("results").innerHTML =
    cards.map(card => `
      <div class="result-card">
        <h3>${card.title}</h3>
        <p>${card.text}</p>
        <span class="tag">${match.title}</span>
      </div>
    `).join("");

  document.getElementById("output")
    .classList.remove("hidden");

  document.getElementById("output")
    .scrollIntoView({ behavior: "smooth" });
});
</script>

</body>
</html>
